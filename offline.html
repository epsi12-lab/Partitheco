<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - Partithéco</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a2a44 0%, #2d4a6f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f9f7f2;
      padding: 1rem;
    }
    .offline-container {
      text-align: center;
      max-width: 500px;
    }
    .offline-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #c5a059;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }
    .btn-retry {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #c5a059;
      color: #1a2a44;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
    }
    .tips {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      font-size: 0.9rem;
    }
    .tips h3 {
      margin-bottom: 0.5rem;
      color: #c5a059;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📶</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Il semble que vous n'ayez pas de connexion Internet. 
      Vérifiez votre connexion et réessayez.
    </p>
    <a href="/" class="btn-retry" onclick="window.location.reload(); return false;">
      🔄 Réessayer
    </a>
    <div class="tips">
      <h3>💡 Astuce</h3>
      <p>Les pages que vous avez déjà visitées sont disponibles hors ligne. Utilisez le bouton retour de votre navigateur pour y accéder.</p>
    </div>
  </div>
</body>
</html>
