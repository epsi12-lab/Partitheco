services:
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      BASE_URL: http://localhost:8000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: partitheco
      DB_USER: partitheco
      DB_PASS: partitheco
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: partitheco
      POSTGRES_PASSWORD: partitheco
      POSTGRES_DB: partitheco
    ports:
      - "5455:5432"
    volumes:
      - partitheco-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partitheco"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partitheco_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  partitheco-db-data:
